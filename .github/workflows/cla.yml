name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action commits signatures to the cla-signatures branch and posts
# PR comments — both need write permissions on a pull_request_target run.
#
# Each permission maps to a call the action actually makes (verified against
# the pinned dist bundle):
#   contents: write      → repos.createOrUpdateFileContents (the signature file)
#   pull-requests: write → issues.createComment / lock / updateComment
#   actions: write       → actions.reRunWorkflow (re-runs the failed check)
# `statuses: write` is what the upstream README asks for. The current
# bundle does not call the commit-status API — the check the ruleset requires
# is this job's own conclusion — but it stays: dropping it on the strength of
# a grep against one released bundle would silently break the `cla` required
# check the next time upstream changes.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# One CLA run per PR. A fork PR can push commits at will, and every push
# fired a fresh write-permission run; queueing them instead of cancelling
# keeps a burst from starving the runner quota.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    # A hung action must not occupy a runner for six hours.
    timeout-minutes: 10
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/Xustalis/OpenPanda/blob/main/CLA.md"
          branch: "cla-signatures"
          # Maintainer accounts and bots don't sign. New external
          # contributors get the prompt on their first PR.
          allowlist: "Xustalis,Xenith,delay813,qz-zhu,devin-ai-integration[bot],dependabot[bot],github-actions[bot]"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: |
            Thanks for the contribution! Before this can be merged, please sign
            the Contributor License Agreement by posting a comment:

            **I have read the CLA Document and I hereby sign the CLA**

            Exempt from signing (see CLA.md §2): trivial changes (typos, docs,
            patches of ~15 lines or fewer) and contributions under `adapters/` —
            a maintainer can merge those directly.

            感谢贡献！合并前请在本 PR 回复上方加粗语句完成 CLA 签署；
            琐碎改动与 `adapters/` 目录贡献无需签署（见 CLA.md §2）。
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✅"
          lock-pullrequest-aftermerge: false
